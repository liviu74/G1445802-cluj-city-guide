  <main>
    <div class="contact-form">
      <h2>Contact Us</h2>
      <p>Have a question about visiting Cluj-Napoca? Send us a message below.</p>
      <br>

      <form id="contact-form" novalidate>
        <div class="form-row">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="form-row">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="form-row">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Write your question here..."></textarea>
        </div>

        <button type="submit" class="btn">Send Message</button>
      </form>

      <p id="form-feedback" style="margin-top: 15px; font-weight: bold;"></p>
    </div>
  </main>
